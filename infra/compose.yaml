# GitLab CE + runner Docker + los ordenadores del equipo, todos en la red gitlab-curso.
# Navegador: http://localhost:$GITLAB_PORT (8080) · dentro de la red: http://gitlab:$GITLAB_PORT
# Git por SSH desde los ordenadores: git@gitlab:<usuario>/<proyecto>.git
name: gitlab-curso

services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.3-ce.0
    hostname: gitlab
    restart: unless-stopped
    ports:
      - "${GITLAB_PORT:-8080}:${GITLAB_PORT:-8080}"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-Formacion-2026!}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_PORT:-8080}'
        nginx['listen_port'] = ${GITLAB_PORT:-8080}
        puma['port'] = 8081
        gitlab_rails['gitlab_ssh_host'] = 'gitlab'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['gitlab_signup_enabled'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m
    networks: [curso]

  runner:
    image: gitlab/gitlab-runner:alpine-v19.4.1
    restart: unless-stopped
    depends_on: [gitlab]
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [curso]

  # Ordenadores del equipo: se entra con `docker exec -it pc-ana bash`. Su carpeta personal es
  # home-<usuario>/ en el workspace, así que lo que Ana edita en VS Code está en su ordenador.
  pc-ana:
    build: {context: pc, args: {USUARIO: ana}}
    image: gitlab-curso-pc:ana
    container_name: pc-ana
    hostname: pc-ana
    init: true
    restart: unless-stopped
    volumes:
      - ../home-ana:/home/ana
    networks: [curso]

  pc-luis:
    build: {context: pc, args: {USUARIO: luis}}
    image: gitlab-curso-pc:luis
    container_name: pc-luis
    hostname: pc-luis
    init: true
    restart: unless-stopped
    volumes:
      - ../home-luis:/home/luis
    networks: [curso]

networks:
  curso:
    name: gitlab-curso

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
